name: Publish HACS release

on:
  push:
    branches:
      - main
    paths:
      - "custom_components/pv_battery_dashboard/manifest.json"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Read manifest version
        id: version
        shell: bash
        run: |
          VERSION="$(python - <<'PY'
          import json
          with open("custom_components/pv_battery_dashboard/manifest.json", encoding="utf-8") as f:
              print(json.load(f)["version"])
          PY
          )"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"

      - name: Validate Python syntax
        shell: bash
        run: |
          python -m compileall -q -f custom_components/pv_battery_dashboard

      - name: Install dashboard validation dependency
        shell: bash
        run: python -m pip install --disable-pip-version-check PyYAML==6.0.2

      - name: Validate dashboard structure and responsive layouts
        shell: bash
        run: python scripts/validate_dashboard.py

      - name: Reject accidental literal newline escapes
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import tokenize

          root = Path("custom_components/pv_battery_dashboard")
          problems = []

          for path in root.rglob("*.py"):
              source = path.read_text(encoding="utf-8")
              masked = list(source)
              lines = source.splitlines(True)

              try:
                  tokens = tokenize.generate_tokens(iter(lines).__next__)
                  for token in tokens:
                      if token.type in (tokenize.STRING, tokenize.COMMENT):
                          start_line, start_col = token.start
                          end_line, end_col = token.end
                          start = sum(map(len, lines[:start_line - 1])) + start_col
                          end = sum(map(len, lines[:end_line - 1])) + end_col
                          for i in range(start, min(end, len(masked))):
                              if masked[i] != "\n":
                                  masked[i] = " "
              except (tokenize.TokenError, IndentationError) as err:
                  raise SystemExit(f"{path}: tokenization failed: {err}")

              code_only = "".join(masked)
              if "\\n" in code_only:
                  for lineno, line in enumerate(code_only.splitlines(), 1):
                      if "\\n" in line:
                          problems.append(
                              f"{path}:{lineno}: literal \\n outside string/comment"
                          )

          if problems:
              raise SystemExit("\n".join(problems))
          PY

      - name: Create version tag if missing
        shell: bash
        run: |
          TAG="${{ steps.version.outputs.tag }}"
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null 2>&1; then
            echo "Tag $TAG already exists"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git tag "$TAG"
            git push origin "$TAG"
          fi

      - name: Build HACS zip
        shell: bash
        run: |
          cd custom_components/pv_battery_dashboard
          zip -r ../../pv_battery_dashboard.zip .
          cd ../..

      - name: Create or update GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: PV & Battery Dashboard ${{ steps.version.outputs.version }}
          prerelease: false
          files: pv_battery_dashboard.zip
          generate_release_notes: true
