            title: PV / Verbrauch / Netz – 14 Tage
            chart_type: bar
            period: day
            days_to_show: 14
            stat_types:
              - change
            entities:
              - entity: sensor.solis_pv_total_energy_generation
                name: PV
              - entity: sensor.solis_total_energy_consumption
                name: Verbrauch
              - entity: sensor.solis_total_energy_imported_from_grid
                name: Netzbezug
              - entity: sensor.solis_total_energy_fed_into_grid
                name: Einspeisung

          - type: statistics-graph
            title: Batterie – 14 Tage
            chart_type: bar
            period: day
            days_to_show: 14
            stat_types:
