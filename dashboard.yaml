            entities:
              - entity: sensor.solis_total_battery_charge_energy
                name: Laden
              - entity: sensor.solis_total_battery_discharge_energy
                name: Entladen

          - type: heading
            heading: Monatsübersicht
            icon: mdi:calendar-month
          - type: tile
            entity: sensor.solis_dashboard_pv_monthly
            name: PV Monat
            icon: mdi:white-balance-sunny
          - type: tile
            entity: sensor.solis_dashboard_consumption_monthly
            name: Verbrauch Monat
            icon: mdi:home-lightning-bolt
          - type: tile
            entity: sensor.solis_dashboard_grid_import_monthly
            name: Netzbezug Monat
            icon: mdi:transmission-tower-import
          - type: tile
            entity: sensor.solis_dashboard_grid_export_monthly
            name: Einspeisung Monat
            icon: mdi:transmission-tower-export
          - type: statistics-graph
            title: Energie pro Monat
            chart_type: bar
            period: month
            days_to_show: 365
            stat_types:
              - change
            entities:
              - entity: sensor.solis_pv_total_energy_generation
                name: PV
              - entity: sensor.solis_total_energy_consumption
                name: Verbrauch
              - entity: sensor.solis_total_energy_imported_from_grid
                name: Netzbezug
              - entity: sensor.solis_total_energy_fed_into_grid
                name: Einspeisung

  - title: Einstellungen Wechselrichter
    path: einstellungen-wechselrichter
    icon: mdi:tune-variant
    type: sections
    max_columns: 4
    sections:
      - type: grid
        column_span: 4
        cards:
          - type: heading
            heading: Einstellungen Wechselrichter
            icon: mdi:inverter

          - type: tile
            entity: sensor.solis_current_status
            name: Status
            icon: mdi:check-circle-outline

          - type: entities
            title: Batterie
            entities:
              - entity: number.solis_time_charging_charge_current
                name: Ladestrom
              - entity: number.solis_time_charging_discharge_current
                name: Entladestrom
              - entity: switch.solis_time_of_use_mode
                name: Time of Use

          - type: entities
            title: System Timer (TOU) – Slot 1
            entities:
              - entity: time.solis_time_charging_charge_start_slot_1
                name: Laden Start
              - entity: time.solis_time_charging_charge_end_slot_1
                name: Laden Ende
              - entity: time.solis_time_charging_discharge_start_slot_1
                name: Entladen Start
              - entity: time.solis_time_charging_discharge_end_slot_1
                name: Entladen Ende

          - type: entities
            title: System Timer (TOU) – Slot 2
            entities:
              - entity: time.solis_time_charging_charge_start_slot_2
                name: Laden Start
              - entity: time.solis_time_charging_charge_end_slot_2
                name: Laden Ende
              - entity: time.solis_time_charging_discharge_start_slot_2
                name: Entladen Start
              - entity: time.solis_time_charging_discharge_end_slot_2
                name: Entladen Ende

          - type: entities
            title: System Timer (TOU) – Slot 3
            entities:
              - entity: time.solis_time_charging_charge_start_slot_3
                name: Laden Start
              - entity: time.solis_time_charging_charge_end_slot_3
                name: Laden Ende
              - entity: time.solis_time_charging_discharge_start_slot_3
                name: Entladen Start
              - entity: time.solis_time_charging_discharge_end_slot_3
                name: Entladen Ende

          - type: markdown
            content: >-
              **Beispielprofil:** Solis Modbus von Pho3niX90.

              Die oben verwendeten `number`-, `switch`- und `time`-Entities
              werden von der Integration für unterstützte Hybridwechselrichter
              bereitgestellt. Welche Bedienelemente tatsächlich vorhanden sind,
              hängt von Modell, Firmware und Poll-Profil ab.

  - title: Einstellungen JK BMS
    path: einstellungen-jk-bms
    icon: mdi:battery-cog
    type: sections
    max_columns: 4
    sections:
      - type: grid
        column_span: 4
        cards:
          - type: heading
            heading: Einstellungen JK BMS
            icon: mdi:battery-heart-variant
          - type: markdown
            content: >-
              Diese Ansicht ist entsprechend dem fünften Mock-up vorbereitet.

              Die konkrete JK-BMS/Gobel-Belegung bleibt getrennt vom Solis-Profil,
              weil die Gobel-Entity-IDs vom Gerätenamen und der Anzahl der
              Master/Slave-Packs abhängen.

              Nach Eintragen der realen Gobel-Entities gehören hier hinein:
              Gesamt-SOC, Spannung, Strom, einzelne Packs, Zellspannungen,
              Temperaturen, SOH, Zyklen, Balancerstatus und Alarme.
