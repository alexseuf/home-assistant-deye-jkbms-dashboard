  - title: Historische Werte
    path: historische-werte
    icon: mdi:chart-line
    type: sections
    sections:
      - type: grid
        cards:
          - type: heading
            heading: Leistungsverlauf
            icon: mdi:chart-areaspline
          - type: history-graph
            title: Leistung
            hours_to_show: 24
            entities:
              - sensor.solarmodbus_device_total_power
              - sensor.solarmodbus_device_battery_power
              - sensor.solarmodbus_device_total_grid_power
          - type: history-graph
            title: Batterie SOC
            hours_to_show: 24
            entities:
              - sensor.solarmodbus_device_battery_soc

  - title: Summierte Werte
    path: summierte-werte
    icon: mdi:sigma
    type: sections
    sections:
      - type: grid
        cards:
          - type: heading
            heading: Heute
            icon: mdi:calendar-today
          - type: tile
            entity: sensor.solarmodbus_device_daily_production
            name: PV-Erzeugung
          - type: tile
            entity: sensor.solarmodbus_device_daily_load_consumption
            name: Verbrauch
          - type: tile
            entity: sensor.solarmodbus_device_daily_energy_bought
            name: Netzbezug
          - type: tile
            entity: sensor.solarmodbus_device_daily_energy_sold
            name: Einspeisung
          - type: tile
            entity: sensor.solarmodbus_device_daily_battery_charge
            name: Batterie geladen
          - type: tile
            entity: sensor.solarmodbus_device_daily_battery_discharge
            name: Batterie entladen

  - title: Einstellungen Deye
    path: einstellungen-deye
    icon: mdi:tune-variant
    type: sections
    sections:
      - type: grid
        cards:
          - type: heading
            heading: Deye Status & Betriebsart
            icon: mdi:inverter
          - type: tile
            entity: sensor.solarmodbus_device_running_status
            name: Status
          - type: tile
            entity: sensor.solarmodbus_device_system_work_mode
            name: Work Mode
          - type: tile
            entity: sensor.solarmodbus_device_solar_sell
            name: Solar Sell
          - type: tile
            entity: sensor.solarmodbus_device_grid_charge
            name: Grid Charge
          - type: markdown
            content: >-
              **Schreibfunktionen werden hier schrittweise ergänzt.**  
              SolarModbus V2 unterstützt `solarmodbus.write_register`, aber Register und gültige Werte werden vor Freigabe für das konkrete Deye-Modell verifiziert.

  - title: Einstellungen JK BMS
    path: einstellungen-jk-bms
    icon: mdi:battery-cog
    type: sections
    sections:
      - type: grid
        cards:
          - type: heading
            heading: JK BMS / Gobel Power
            icon: mdi:battery-heart-variant
          - type: markdown
            content: >-
              Die Gobel-Power-Integration erzeugt die Entity-IDs abhängig vom konfigurierten Gerätenamen und erkennt Master/Slave-Packs dynamisch.

              Die aktuelle Integration stellt `sensor` und `binary_sensor` bereit. Deshalb werden hier keine erfundenen Schreibregler angelegt. Nach dem Mapping deiner realen Gobel-Entities kommen Gesamtwerte, einzelne Packs, Zellspannungen, Temperaturen, Balancing und Warnungen hier hinein.
