title: PV & Batteries

views:
  - title: Aktuelle Werte
    path: aktuelle-werte
    icon: mdi:solar-power
    type: panel
    cards:
      - type: vertical-stack
        cards:
          - type: custom:mushroom-title-card
            title: Energiefluss (aktuell)

          - type: picture-elements
            image: /pv-battery-dashboard-static/energy_flow_bg_v0113.svg
            elements:
              # PV
              - type: state-label
                entity: sensor.solis_s5_eh1p_total_pv_power
                style:
                  left: 11%
                  top: 25.5%
                  width: 18%
                  transform: translate(0, -50%)
                  text-align: left
                  color: "#111827"
                  font-size: "clamp(22px, 2.4vw, 36px)"
                  font-weight: 700
              - type: state-label
                entity: sensor.solis_s5_eh1p_pv_today_energy_generation
                style:
                  left: 11%
                  top: 39%
                  width: 20%
                  transform: translate(0, -50%)
                  text-align: left
                  color: "#111827"
                  font-size: "clamp(10px, 0.95vw, 14px)"
                  font-weight: 600

              # Verbrauch
              - type: state-label
                entity: sensor.calculated_household_load_power
                style:
                  left: 81%
                  top: 25.5%
                  width: 16%
                  transform: translate(0, -50%)
                  text-align: left
                  color: "#111827"
                  font-size: "clamp(22px, 2.4vw, 36px)"
                  font-weight: 700
              - type: state-label
                entity: sensor.solis_s5_eh1p_today_energy_consumption
                style:
                  left: 81%
                  top: 39%
                  width: 17%
                  transform: translate(0, -50%)
                  text-align: left
                  color: "#111827"
                  font-size: "clamp(10px, 0.95vw, 14px)"
                  font-weight: 600

              # Wechselrichter
              - type: state-label
                entity: sensor.solis_s5_eh1p_status_string
                style:
                  left: 50%
                  top: 59%
                  color: "#20ae55"
                  font-size: "clamp(10px, 0.85vw, 12px)"
                  font-weight: 600

              # Batterie
              - type: state-label
                entity: sensor.jk_bms_total_jk_bms_total_power
                style:
                  left: 11%
                  top: 72%
                  width: 18%
                  transform: translate(0, -50%)
                  text-align: left
                  color: "#111827"
                  font-size: "clamp(22px, 2.4vw, 36px)"
                  font-weight: 700
              - type: state-label
                entity: sensor.jk_bms_total_jk_bms_total_soc
                style:
                  left: 11%
                  top: 89%
                  width: 18%
                  transform: translate(0, -50%)
                  text-align: left
                  color: "#111827"
                  font-size: "clamp(10px, 0.95vw, 14px)"
                  font-weight: 600

              # Netz
              - type: state-label
                entity: sensor.solis_s5_eh1p_ac_grid_port_power
                style:
                  left: 81%
                  top: 72%
                  width: 16%
                  transform: translate(0, -50%)
                  text-align: left
                  color: "#111827"
                  font-size: "clamp(22px, 2.4vw, 36px)"
                  font-weight: 700
              - type: state-label
                entity: sensor.solis_s5_eh1p_today_energy_fed_into_grid
                style:
                  left: 81%
                  top: 89%
                  width: 17%
                  transform: translate(0, -50%)
                  text-align: left
                  color: "#111827"
                  font-size: "clamp(10px, 0.95vw, 14px)"
                  font-weight: 600

          - &current_metrics
            type: grid
            columns: 5
            square: false
            visibility:
              - condition: screen
                media_query: "(min-width: 700px)"
            cards:
              - type: custom:mushroom-entity-card
                entity: sensor.solis_s5_eh1p_pv_voltage_1
                name: PV1 Spannung
                icon: mdi:solar-panel-large
                icon_color: amber
              - type: custom:mushroom-entity-card
                entity: sensor.solis_s5_eh1p_pv_voltage_2
                name: PV2 Spannung
                icon: mdi:solar-panel-large
                icon_color: amber
              - type: custom:mushroom-entity-card
                entity: sensor.batteriespannung_1_dezimal
                name: Batterie
                icon: mdi:battery
                icon_color: green
              - type: custom:mushroom-entity-card
                entity: sensor.jk_bms_total_jk_bms_total_current
                name: Batteriestrom
                icon: mdi:current-dc
                icon_color: green
              - type: custom:mushroom-entity-card
                entity: sensor.jk_bms_pack_00_temperature_01
                name: BMS Temperatur
                icon: mdi:thermometer
                icon_color: orange

          - <<: *current_metrics
            columns: 2
            visibility:
              - condition: screen
                media_query: "(max-width: 699px)"

          - type: custom:apexcharts-card
            header:
              show: true
              title: Leistungsverlauf – letzte 24 Stunden
              show_states: false
            graph_span: 24h
            apex_config:
              chart:
                height: 340
                toolbar:
                  show: true
              legend:
                show: true
                position: bottom
              stroke:
                width: 2
              grid:
                borderColor: "#dce5ea"
              yaxis:
                labels:
                  formatter: |
                    EVAL:function(value) { return value.toFixed(1) + " kW"; }
            series:
              - entity: sensor.solis_s5_eh1p_total_pv_power
                name: PV
                color: "#ffb000"
                type: line
                unit: kW
                transform: "return x / 1000;"
                group_by:
                  func: avg
                  duration: 5min
              - entity: sensor.calculated_household_load_power
                name: Verbrauch
                color: "#2196f3"
                type: line
                unit: kW
                transform: "return x / 1000;"
                group_by:
                  func: avg
                  duration: 5min
              - entity: sensor.jk_bms_total_jk_bms_total_power
                name: Batterie
                color: "#20ae55"
                type: line
                unit: kW
                group_by:
                  func: avg
                  duration: 5min
              - entity: sensor.solis_s5_eh1p_ac_grid_port_power
                name: Netz
                color: "#ef5545"
                type: line
                unit: kW
                transform: "return x / 1000;"
                group_by:
                  func: avg
                  duration: 5min

  - title: Historische Werte
    path: historische-werte
    icon: mdi:chart-line
    type: panel
    cards:
      - type: vertical-stack
        cards:
          - type: custom:mushroom-title-card
            title: 2. Historische Werte
            subtitle: 24 Stunden · Leistung · Batterie · PV-Eingänge

          - type: custom:mushroom-chips-card
            alignment: start
            chips:
              - type: template
                icon: mdi:clock-outline
                content: 24 Stunden
                icon_color: blue
                tap_action:
                  action: navigate
                  navigation_path: /pv-battery-dashboard/historische-werte
              - type: template
                icon: mdi:calendar-week
                content: 7 Tage
                tap_action:
                  action: navigate
                  navigation_path: /pv-battery-dashboard/historische-werte-7-tage
              - type: template
                icon: mdi:calendar-month
                content: 30 Tage
                tap_action:
                  action: navigate
                  navigation_path: /pv-battery-dashboard/historische-werte-30-tage
              - type: template
                icon: mdi:calendar-range
                content: 12 Monate
                tap_action:
                  action: navigate
                  navigation_path: /pv-battery-dashboard/historische-werte-12-monate
              - type: template
                icon: mdi:calendar-edit
                content: Benutzerdefiniert
                tap_action:
                  action: navigate
                  navigation_path: /pv-battery-dashboard/historische-werte-benutzerdefiniert

          - type: custom:apexcharts-card
            header:
              show: true
              title: Leistung
            graph_span: 24h
            apex_config:
              chart:
                height: 330
              stroke:
                width: 2
              legend:
                position: bottom
              grid:
                borderColor: "#dce5ea"
            series:
              - entity: sensor.solis_s5_eh1p_total_pv_power
                name: PV
                color: "#ffb000"
                type: area
                transform: "return x / 1000;"
                unit: kW
                group_by: {func: avg, duration: 5min}
              - entity: sensor.calculated_household_load_power
                name: Verbrauch
                color: "#168cf0"
                type: line
                transform: "return x / 1000;"
                unit: kW
                group_by: {func: avg, duration: 5min}
              - entity: sensor.jk_bms_total_jk_bms_total_power
                name: Batterie
                color: "#20ae55"
                type: area
                unit: kW
                group_by: {func: avg, duration: 5min}
              - entity: sensor.solis_s5_eh1p_ac_grid_port_power
                name: Netz
                color: "#ef5545"
                type: line
                transform: "return x / 1000;"
                unit: kW
                group_by: {func: avg, duration: 5min}

          - type: custom:apexcharts-card
            header:
              show: true
              title: Batterie SOC
            graph_span: 24h
            apex_config:
              chart: {height: 250}
              yaxis: {min: 0, max: 100}
              fill:
                type: gradient
              legend:
                position: bottom
            series:
              - entity: sensor.jk_bms_total_jk_bms_total_soc
                name: Gesamt
                color: "#20ae55"
                type: area
                group_by: {func: avg, duration: 5min}

          - &history_detail_grid
            type: grid
            columns: 2
            square: false
            visibility:
              - condition: screen
                media_query: "(min-width: 700px)"
            cards:
              - &history_battery_electrical
                type: custom:apexcharts-card
                header: {show: true, title: Batteriespannung & Strom}
                graph_span: 24h
                all_series_config: {group_by: {func: avg, duration: 5min}}
                yaxis:
                  - id: voltage
                  - id: current
                    opposite: true
                apex_config:
                  chart: {height: 270}
                  legend: {position: bottom}
                series:
                  - entity: sensor.jk_bms_total_jk_bms_total_voltage
                    name: Spannung
                    color: "#168cf0"
                    yaxis_id: voltage
                    type: line
                  - entity: sensor.jk_bms_total_jk_bms_total_current
                    name: Strom
                    color: "#ef5545"
                    yaxis_id: current
                    type: line
              - &history_mppt_voltage
                type: custom:apexcharts-card
                header: {show: true, title: PV Eingänge (MPPT)}
                graph_span: 24h
                all_series_config: {group_by: {func: avg, duration: 5min}}
                apex_config:
                  chart: {height: 270}
                  legend: {position: bottom}
                series:
                  - entity: sensor.solis_s5_eh1p_pv_voltage_1
                    name: MPPT 1
                    color: "#ffb000"
                    type: line
                  - entity: sensor.solis_s5_eh1p_pv_voltage_2
                    name: MPPT 2
                    color: "#20ae55"
                    type: line

          - <<: *history_detail_grid
            columns: 1
            visibility:
              - condition: screen
                media_query: "(max-width: 699px)"

          - &history_extended_grid
            type: grid
            columns: 2
            square: false
            visibility:
              - condition: screen
                media_query: "(min-width: 700px)"
            cards:
              - &history_inverter_temperature
                type: custom:apexcharts-card
                header: {show: true, title: Wechselrichtertemperatur}
                graph_span: 24h
                all_series_config: {group_by: {func: avg, duration: 5min}}
                apex_config:
                  chart: {height: 270}
                  legend: {position: bottom}
                series:
                  - {entity: sensor.solis_s5_eh1p_temperature, name: Wechselrichter, color: "#ef5545", type: area}
                  - {entity: sensor.solis_s5_eh1p_lead_acid_battery_temperature, name: Batterie (Solis), color: "#20ae55", type: line}
              - &history_grid_quality
                type: custom:apexcharts-card
                header: {show: true, title: Netzspannung & Frequenz}
                graph_span: 24h
                all_series_config: {group_by: {func: avg, duration: 5min}}
                yaxis:
                  - id: voltage
                  - id: frequency
                    opposite: true
                apex_config:
                  chart: {height: 270}
                  legend: {position: bottom}
                series:
                  - {entity: sensor.solis_s5_eh1p_a_phase_voltage, name: Netzspannung, color: "#168cf0", yaxis_id: voltage, type: line}
                  - {entity: sensor.solis_s5_eh1p_grid_frequency, name: Netzfrequenz, color: "#ef5545", yaxis_id: frequency, type: line}
              - &history_ac_load
                type: custom:apexcharts-card
                header: {show: true, title: Backup-AC & Last}
                graph_span: 24h
                all_series_config: {group_by: {func: avg, duration: 5min}}
                yaxis:
                  - id: voltage
                  - id: power
                    opposite: true
                apex_config:
                  chart: {height: 270}
                  legend: {position: bottom}
                series:
                  - {entity: sensor.solis_s5_eh1p_backup_ac_voltage_phase_a, name: AC-Spannung, color: "#168cf0", yaxis_id: voltage, type: line}
                  - {entity: sensor.calculated_household_load_power, name: Hauslast, color: "#7e57c2", yaxis_id: power, type: area, transform: "return x / 1000;", unit: kW}
                  - {entity: sensor.solis_s5_eh1p_backup_load_power, name: Backup-Last, color: "#ef5545", yaxis_id: power, type: line, transform: "return x / 1000;", unit: kW}
              - &history_mppt_current
                type: custom:apexcharts-card
                header: {show: true, title: MPPT-Ströme}
                graph_span: 24h
                all_series_config: {group_by: {func: avg, duration: 5min}}
                apex_config:
                  chart: {height: 270}
                  legend: {position: bottom}
                series:
                  - {entity: sensor.solis_s5_eh1p_pv_current_1, name: MPPT 1, color: "#ffb000", type: line}
                  - {entity: sensor.solis_s5_eh1p_pv_current_2, name: MPPT 2, color: "#20ae55", type: line}
              - &history_mppt_power
                type: custom:apexcharts-card
                header: {show: true, title: PV- & MPPT-Leistung}
                graph_span: 24h
                all_series_config: {group_by: {func: avg, duration: 5min}}
                apex_config:
                  chart: {height: 270}
                  legend: {position: bottom}
                series:
                  - {entity: sensor.solis_s5_eh1p_pv_power_1, name: MPPT 1, color: "#ffb000", type: line, transform: "return x / 1000;", unit: kW}
                  - {entity: sensor.solis_s5_eh1p_pv_power_2, name: MPPT 2, color: "#ffd54f", type: line, transform: "return x / 1000;", unit: kW}
                  - {entity: sensor.solis_s5_eh1p_total_pv_power, name: PV gesamt, color: "#f57f17", type: area, transform: "return x / 1000;", unit: kW}
              - &history_pack_delta
                type: custom:apexcharts-card
                header: {show: true, title: Zellspannungsdifferenz je Batteriepack}
                graph_span: 24h
                all_series_config: {group_by: {func: avg, duration: 5min}}
                apex_config:
                  chart: {height: 270}
                  legend: {position: bottom}
                series:
                  - {entity: sensor.solar_pv_battery_dashboard_pack_1_zell_delta, name: Pack 1, color: "#168cf0", type: line}
                  - {entity: sensor.solar_pv_battery_dashboard_pack_2_zell_delta, name: Pack 2, color: "#20ae55", type: line}
                  - {entity: sensor.solar_pv_battery_dashboard_pack_3_zell_delta, name: Pack 3, color: "#ef5545", type: line}
              - &history_pack_temperature
                type: custom:apexcharts-card
                header: {show: true, title: Maximale Zelltemperatur je Batteriepack}
                graph_span: 24h
                all_series_config: {group_by: {func: max, duration: 5min}}
                apex_config:
                  chart: {height: 270}
                  legend: {position: bottom}
                series:
                  - {entity: sensor.solar_pv_battery_dashboard_pack_1_max_zelltemperatur, name: Pack 1, color: "#168cf0", type: line}
                  - {entity: sensor.solar_pv_battery_dashboard_pack_2_max_zelltemperatur, name: Pack 2, color: "#20ae55", type: line}
                  - {entity: sensor.solar_pv_battery_dashboard_pack_3_max_zelltemperatur, name: Pack 3, color: "#ef5545", type: line}

          - <<: *history_extended_grid
            columns: 1
            visibility:
              - condition: screen
                media_query: "(max-width: 699px)"

  - title: Historische Werte · 7 Tage
    path: historische-werte-7-tage
    subview: true
    type: panel
    cards:
      - type: vertical-stack
        cards:
          - type: custom:mushroom-title-card
            title: 2. Historische Werte
            subtitle: 7 Tage · Leistung und Batterie-SOC
          - type: custom:mushroom-chips-card
            alignment: start
            chips:
              - {type: template, icon: mdi:clock-outline, content: 24 Stunden, tap_action: {action: navigate, navigation_path: /pv-battery-dashboard/historische-werte}}
              - {type: template, icon: mdi:calendar-week, content: 7 Tage, icon_color: blue, tap_action: {action: navigate, navigation_path: /pv-battery-dashboard/historische-werte-7-tage}}
              - {type: template, icon: mdi:calendar-month, content: 30 Tage, tap_action: {action: navigate, navigation_path: /pv-battery-dashboard/historische-werte-30-tage}}
              - {type: template, icon: mdi:calendar-range, content: 12 Monate, tap_action: {action: navigate, navigation_path: /pv-battery-dashboard/historische-werte-12-monate}}
              - {type: template, icon: mdi:calendar-edit, content: Benutzerdefiniert, tap_action: {action: navigate, navigation_path: /pv-battery-dashboard/historische-werte-benutzerdefiniert}}
          - type: custom:apexcharts-card
            header: {show: true, title: Leistung · 7 Tage}
            graph_span: 7d
            apex_config:
              chart: {height: 360}
              stroke: {width: 2}
              legend: {position: bottom}
              grid: {borderColor: "#dce5ea"}
            series:
              - {entity: sensor.solis_s5_eh1p_total_pv_power, name: PV, color: "#ffb000", type: area, unit: kW, transform: "return x / 1000;", group_by: {func: avg, duration: 30min}}
              - {entity: sensor.calculated_household_load_power, name: Verbrauch, color: "#168cf0", type: line, unit: kW, transform: "return x / 1000;", group_by: {func: avg, duration: 30min}}
              - {entity: sensor.jk_bms_total_jk_bms_total_power, name: Batterie, color: "#20ae55", type: area, unit: kW, group_by: {func: avg, duration: 30min}}
              - {entity: sensor.solis_s5_eh1p_ac_grid_port_power, name: Netz, color: "#ef5545", type: line, unit: kW, transform: "return x / 1000;", group_by: {func: avg, duration: 30min}}
          - type: custom:apexcharts-card
            header: {show: true, title: Batterie SOC · 7 Tage}
            graph_span: 7d
            apex_config:
              chart: {height: 270}
              yaxis: {min: 0, max: 100}
            series:
              - {entity: sensor.jk_bms_total_jk_bms_total_soc, name: Gesamt, color: "#20ae55", type: area, group_by: {func: avg, duration: 30min}}
          - &history_extended_grid_7d
            <<: *history_extended_grid
            cards:
              - {<<: *history_battery_electrical, graph_span: 7d, all_series_config: {group_by: {func: avg, duration: 30min}}}
              - {<<: *history_mppt_voltage, graph_span: 7d, all_series_config: {group_by: {func: avg, duration: 30min}}}
              - {<<: *history_inverter_temperature, graph_span: 7d, all_series_config: {group_by: {func: avg, duration: 30min}}}
              - {<<: *history_grid_quality, graph_span: 7d, all_series_config: {group_by: {func: avg, duration: 30min}}}
              - {<<: *history_ac_load, graph_span: 7d, all_series_config: {group_by: {func: avg, duration: 30min}}}
              - {<<: *history_mppt_current, graph_span: 7d, all_series_config: {group_by: {func: avg, duration: 30min}}}
              - {<<: *history_mppt_power, graph_span: 7d, all_series_config: {group_by: {func: avg, duration: 30min}}}
              - {<<: *history_pack_delta, graph_span: 7d, all_series_config: {group_by: {func: avg, duration: 30min}}}
              - {<<: *history_pack_temperature, graph_span: 7d, all_series_config: {group_by: {func: max, duration: 30min}}}
          - <<: *history_extended_grid_7d
            columns: 1
            visibility:
              - condition: screen
                media_query: "(max-width: 699px)"

  - title: Historische Werte · 30 Tage
    path: historische-werte-30-tage
    subview: true
    type: panel
    cards:
      - type: vertical-stack
        cards:
          - type: custom:mushroom-title-card
            title: 2. Historische Werte
            subtitle: 30 Tage · Leistung und Batterie-SOC
          - type: custom:mushroom-chips-card
            alignment: start
            chips:
              - {type: template, icon: mdi:clock-outline, content: 24 Stunden, tap_action: {action: navigate, navigation_path: /pv-battery-dashboard/historische-werte}}
              - {type: template, icon: mdi:calendar-week, content: 7 Tage, tap_action: {action: navigate, navigation_path: /pv-battery-dashboard/historische-werte-7-tage}}
              - {type: template, icon: mdi:calendar-month, content: 30 Tage, icon_color: blue, tap_action: {action: navigate, navigation_path: /pv-battery-dashboard/historische-werte-30-tage}}
              - {type: template, icon: mdi:calendar-range, content: 12 Monate, tap_action: {action: navigate, navigation_path: /pv-battery-dashboard/historische-werte-12-monate}}
              - {type: template, icon: mdi:calendar-edit, content: Benutzerdefiniert, tap_action: {action: navigate, navigation_path: /pv-battery-dashboard/historische-werte-benutzerdefiniert}}
          - type: custom:apexcharts-card
            header: {show: true, title: Leistung · 30 Tage}
            graph_span: 30d
            apex_config:
              chart: {height: 360}
              stroke: {width: 2}
              legend: {position: bottom}
              grid: {borderColor: "#dce5ea"}
            series:
              - {entity: sensor.solis_s5_eh1p_total_pv_power, name: PV, color: "#ffb000", type: area, unit: kW, transform: "return x / 1000;", group_by: {func: avg, duration: 2h}}
              - {entity: sensor.calculated_household_load_power, name: Verbrauch, color: "#168cf0", type: line, unit: kW, transform: "return x / 1000;", group_by: {func: avg, duration: 2h}}
              - {entity: sensor.jk_bms_total_jk_bms_total_power, name: Batterie, color: "#20ae55", type: area, unit: kW, group_by: {func: avg, duration: 2h}}
              - {entity: sensor.solis_s5_eh1p_ac_grid_port_power, name: Netz, color: "#ef5545", type: line, unit: kW, transform: "return x / 1000;", group_by: {func: avg, duration: 2h}}
          - type: custom:apexcharts-card
            header: {show: true, title: Batterie SOC · 30 Tage}
            graph_span: 30d
            apex_config:
              chart: {height: 270}
              yaxis: {min: 0, max: 100}
            series:
              - {entity: sensor.jk_bms_total_jk_bms_total_soc, name: Gesamt, color: "#20ae55", type: area, group_by: {func: avg, duration: 2h}}
          - &history_extended_grid_30d
            <<: *history_extended_grid
            cards:
              - {<<: *history_battery_electrical, graph_span: 30d, all_series_config: {group_by: {func: avg, duration: 2h}}}
              - {<<: *history_mppt_voltage, graph_span: 30d, all_series_config: {group_by: {func: avg, duration: 2h}}}
              - {<<: *history_inverter_temperature, graph_span: 30d, all_series_config: {group_by: {func: avg, duration: 2h}}}
              - {<<: *history_grid_quality, graph_span: 30d, all_series_config: {group_by: {func: avg, duration: 2h}}}
