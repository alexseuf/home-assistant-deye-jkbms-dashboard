# Home Assistant PV & Battery Dashboard
# Concrete verified profile: Solis S5-EH1P + Gobel Battery / JK BMS
# Entity IDs in this file were verified from the target Home Assistant export
# dated 2026-09-27. UI labels remain manufacturer-neutral where practical.

title: PV & Batteries

views:
  - title: Aktuelle Werte
    path: aktuelle-werte
    icon: mdi:solar-power
    type: sections
    max_columns: 4
    dense_section_placement: true
    sections:
      - type: grid
        column_span: 4
        cards:
          - type: heading
            heading: Energiefluss (aktuell)
            icon: mdi:transmission-tower

          - type: tile
            entity: sensor.solis_s5_eh1p_total_pv_power
            name: PV
            icon: mdi:solar-power
            vertical: true

          - type: tile
            entity: sensor.solis_s5_eh1p_household_load_power
            name: Verbrauch
            icon: mdi:home-lightning-bolt
            vertical: true

          - type: tile
            entity: sensor.jk_bms_total_jk_bms_total_power
            name: Batterie
            icon: mdi:battery-charging
            vertical: true

          - type: tile
            entity: sensor.jk_bms_total_jk_bms_total_soc
            name: Batterie SOC
            icon: mdi:battery-high
            vertical: true

          - type: tile
            entity: sensor.solis_s5_eh1p_ac_grid_port_power
            name: Netz
            icon: mdi:transmission-tower
            vertical: true

          - type: tile
            entity: sensor.solis_s5_eh1p_status_string
            name: Wechselrichterstatus
            icon: mdi:check-circle-outline
            vertical: true

          - type: heading
            heading: Energie heute
            icon: mdi:calendar-today

          - type: tile
            entity: sensor.solis_s5_eh1p_pv_today_energy_generation
            name: PV-Ertrag
            icon: mdi:white-balance-sunny

          - type: tile
            entity: sensor.solis_s5_eh1p_today_energy_consumption
            name: Verbrauch
            icon: mdi:home-lightning-bolt-outline

          - type: tile
            entity: sensor.solis_s5_eh1p_today_energy_imported_from_grid
            name: Netzbezug
            icon: mdi:transmission-tower-import

          - type: tile
            entity: sensor.solis_s5_eh1p_today_energy_fed_into_grid
            name: Einspeisung
            icon: mdi:transmission-tower-export

          - type: tile
            entity: sensor.solis_s5_eh1p_today_battery_charge_energy
            name: Batterie geladen
            icon: mdi:battery-plus

          - type: tile
            entity: sensor.solis_s5_eh1p_today_battery_discharge_energy
            name: Batterie entladen
            icon: mdi:battery-minus

      - type: grid
        column_span: 4
        cards:
          - type: heading
            heading: Elektrische Werte
            icon: mdi:meter-electric-outline

          - type: tile
            entity: sensor.solis_s5_eh1p_pv_voltage_1
            name: PV Spannung 1
            icon: mdi:sine-wave

          - type: tile
            entity: sensor.solis_s5_eh1p_pv_voltage_2
            name: PV Spannung 2
            icon: mdi:sine-wave

          - type: tile
            entity: sensor.solis_s5_eh1p_pv_current_1
            name: PV Strom 1
            icon: mdi:current-dc

          - type: tile
            entity: sensor.solis_s5_eh1p_pv_current_2
            name: PV Strom 2
            icon: mdi:current-dc

          - type: tile
            entity: sensor.jk_bms_total_jk_bms_total_voltage
            name: Batteriespannung
            icon: mdi:flash-outline

          - type: tile
            entity: sensor.jk_bms_total_jk_bms_total_current
            name: Batteriestrom
            icon: mdi:current-dc

          - type: tile
            entity: sensor.solis_s5_eh1p_a_phase_voltage
            name: AC Spannung
            icon: mdi:current-ac

          - type: tile
            entity: sensor.solis_s5_eh1p_grid_frequency
            name: Frequenz
            icon: mdi:sine-wave

      - type: grid
        column_span: 4
        cards:
          - type: heading
            heading: Leistungsverlauf (heute)
            icon: mdi:chart-areaspline

          - type: history-graph
            title: PV / Verbrauch / Batterie / Netz
            hours_to_show: 24
            entities:
              - entity: sensor.solis_s5_eh1p_total_pv_power
                name: PV
              - entity: sensor.solis_s5_eh1p_household_load_power
                name: Verbrauch
              - entity: sensor.jk_bms_total_jk_bms_total_power
                name: Batterie
              - entity: sensor.solis_s5_eh1p_ac_grid_port_power
                name: Netz

  - title: Historische Werte
    path: historische-werte
    icon: mdi:chart-line
    type: sections
    max_columns: 4
    sections:
      - type: grid
        column_span: 4
        cards:
          - type: heading
            heading: Historische Werte
            icon: mdi:chart-areaspline

          - type: history-graph
            title: Leistung – letzte 24 Stunden
            hours_to_show: 24
            entities:
              - entity: sensor.solis_s5_eh1p_total_pv_power
                name: PV
              - entity: sensor.solis_s5_eh1p_household_load_power
                name: Verbrauch
              - entity: sensor.jk_bms_total_jk_bms_total_power
                name: Batterie
              - entity: sensor.solis_s5_eh1p_ac_grid_port_power
                name: Netz

          - type: history-graph
            title: Batterie SOC – letzte 24 Stunden
            hours_to_show: 24
            entities:
              - entity: sensor.jk_bms_total_jk_bms_total_soc
                name: Gesamt-SOC
              - entity: sensor.jk_bms_pack_00_soc
                name: Pack 00
              - entity: sensor.jk_bms_pack_01_soc
                name: Pack 01
              - entity: sensor.jk_bms_pack_02_soc
                name: Pack 02

          - type: history-graph
            title: Batteriespannung & Strom – letzte 24 Stunden
            hours_to_show: 24
            entities:
              - entity: sensor.jk_bms_total_jk_bms_total_voltage
                name: Spannung
              - entity: sensor.jk_bms_total_jk_bms_total_current
                name: Strom

          - type: history-graph
            title: PV Eingänge (MPPT) – letzte 24 Stunden
            hours_to_show: 24
            entities:
              - entity: sensor.solis_s5_eh1p_pv_power_1
                name: PV 1 Leistung
              - entity: sensor.solis_s5_eh1p_pv_power_2
                name: PV 2 Leistung
              - entity: sensor.solis_s5_eh1p_pv_voltage_1
                name: PV 1 Spannung
              - entity: sensor.solis_s5_eh1p_pv_voltage_2
                name: PV 2 Spannung

  - title: Summierte Werte
    path: summierte-werte
    icon: mdi:sigma
    type: sections
    max_columns: 4
    sections:
      - type: grid
        column_span: 4
        cards:
          - type: heading
            heading: Summierte Werte
            icon: mdi:chart-box-outline

          - type: tile
            entity: sensor.solis_s5_eh1p_pv_today_energy_generation
            name: PV Ertrag heute
            icon: mdi:white-balance-sunny

          - type: tile
            entity: sensor.solis_s5_eh1p_today_energy_consumption
            name: Verbrauch heute
            icon: mdi:home-lightning-bolt

          - type: tile
            entity: sensor.solis_s5_eh1p_today_energy_imported_from_grid
            name: Netzbezug heute
            icon: mdi:transmission-tower-import

          - type: tile
            entity: sensor.solis_s5_eh1p_today_energy_fed_into_grid
            name: Einspeisung heute
            icon: mdi:transmission-tower-export

          - type: tile
            entity: sensor.solis_s5_eh1p_today_battery_charge_energy
            name: Batterie Laden heute
            icon: mdi:battery-plus

          - type: tile
            entity: sensor.solis_s5_eh1p_today_battery_discharge_energy
            name: Batterie Entladen heute
            icon: mdi:battery-minus

          - type: heading
            heading: Tageswerte · 14 Tage
            icon: mdi:chart-bar

          - type: statistics-graph
            title: PV / Verbrauch / Netz – 14 Tage
            chart_type: bar
            period: day
            days_to_show: 14
            stat_types:
              - change
            entities:
              - entity: sensor.solis_s5_eh1p_pv_total_energy_generation
                name: PV
              - entity: sensor.solis_s5_eh1p_total_energy_consumption
                name: Verbrauch
              - entity: sensor.solis_s5_eh1p_total_energy_imported_from_grid
                name: Netzbezug
              - entity: sensor.solis_s5_eh1p_total_energy_fed_into_grid
                name: Einspeisung

          - type: statistics-graph
            title: Batterie – 14 Tage
            chart_type: bar
            period: day
            days_to_show: 14
            stat_types:
              - change
            entities:
              - entity: sensor.solis_s5_eh1p_total_battery_charge_energy
                name: Laden
              - entity: sensor.solis_s5_eh1p_total_battery_discharge_energy
                name: Entladen

          - type: heading
            heading: Monat / Jahr
            icon: mdi:calendar-month

          - type: tile
            entity: sensor.solis_s5_eh1p_pv_current_month_energy_generation
            name: PV aktueller Monat
            icon: mdi:calendar-month

          - type: tile
            entity: sensor.solis_s5_eh1p_pv_this_year_energy_generation
            name: PV aktuelles Jahr
            icon: mdi:calendar

          - type: statistics-graph
            title: Energie pro Monat
            chart_type: bar
            period: month
            days_to_show: 365
            stat_types:
              - change
            entities:
              - entity: sensor.solis_s5_eh1p_pv_total_energy_generation
                name: PV
              - entity: sensor.solis_s5_eh1p_total_energy_consumption
                name: Verbrauch
              - entity: sensor.solis_s5_eh1p_total_energy_imported_from_grid
                name: Netzbezug
              - entity: sensor.solis_s5_eh1p_total_energy_fed_into_grid
                name: Einspeisung

  - title: Einstellungen Wechselrichter
    path: einstellungen-wechselrichter
    icon: mdi:tune-variant
    type: sections
    max_columns: 4
    sections:
      - type: grid
        column_span: 4
        cards:
          - type: heading
            heading: Einstellungen Wechselrichter
            icon: mdi:inverter

          - type: tile
            entity: sensor.solis_s5_eh1p_status_string
            name: Status
            icon: mdi:check-circle-outline

          - type: tile
            entity: switch.solis_s5_eh1p_solis_modbus_enabled
            name: Solis Modbus
            icon: mdi:connection

          - type: entities
            title: Batterie / BMS
            entities:
              - entity: sensor.solis_s5_eh1p_battery_charge_current_limitation_bms
                name: Max. Ladestrom BMS
              - entity: sensor.solis_s5_eh1p_battery_discharge_current_limitation_bms
                name: Max. Entladestrom BMS
              - entity: sensor.solis_s5_eh1p_battery_voltage_bms
                name: Batteriespannung BMS
              - entity: sensor.solis_s5_eh1p_battery_current_bms
                name: Batteriestrom BMS
              - entity: sensor.solis_s5_eh1p_battery_soh
                name: Batterie SOH

          - type: entities
            title: Wechselrichter Diagnose
            entities:
              - entity: sensor.solis_s5_eh1p_model_no
                name: Modell
              - entity: sensor.solis_s5_eh1p_serial_number
                name: Seriennummer
              - entity: sensor.solis_s5_eh1p_protocol_version
                name: Protokollversion
              - entity: sensor.solis_s5_eh1p_dsp_version
                name: DSP Version
              - entity: sensor.solis_s5_eh1p_hmi_version
                name: HMI Version
              - entity: sensor.solis_s5_eh1p_last_modbus_success
                name: Letzte Modbus-Antwort
              - entity: sensor.solis_s5_eh1p_temperature
                name: Temperatur
              - entity: sensor.solis_s5_eh1p_alarm_code_data
                name: Alarmcode

          - type: markdown
            content: >-
              In der exportierten Entity-Liste sind für diesen Solis S5-EH1P
              keine TOU-`number`- oder `time`-Entities vorhanden. Deshalb
              zeigt diese Ansicht nur die tatsächlich vorhandenen Diagnosewerte
              sowie den vorhandenen Modbus-Schalter. Nicht vorhandene
              Bedienelemente werden bewusst nicht erfunden.

