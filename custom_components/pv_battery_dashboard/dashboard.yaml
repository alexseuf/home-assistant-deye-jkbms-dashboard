title: PV & Batteries

views:
  - title: Aktuelle Werte
    path: aktuelle-werte
    icon: mdi:solar-power
    type: panel
    cards:
      - type: vertical-stack
        cards:
          - type: custom:mushroom-title-card
            title: Energiefluss (aktuell)

          - type: picture-elements
            image: /pv-battery-dashboard-static/energy_flow_bg_v0113.svg
            elements:
              # PV
              - type: state-label
                entity: sensor.solis_s5_eh1p_total_pv_power
                style:
                  left: 11%
                  top: 25.5%
                  width: 18%
                  transform: translate(0, -50%)
                  text-align: left
                  color: "#111827"
                  font-size: "clamp(22px, 2.4vw, 36px)"
                  font-weight: 700
              - type: state-label
                entity: sensor.solis_s5_eh1p_pv_today_energy_generation
                style:
                  left: 11%
                  top: 39%
                  width: 20%
                  transform: translate(0, -50%)
                  text-align: left
                  color: "#111827"
                  font-size: "clamp(10px, 0.95vw, 14px)"
                  font-weight: 600

              # Verbrauch
              - type: state-label
                entity: sensor.solis_s5_eh1p_household_load_power
                style:
                  left: 81%
                  top: 25.5%
                  width: 16%
                  transform: translate(0, -50%)
                  text-align: left
                  color: "#111827"
                  font-size: "clamp(22px, 2.4vw, 36px)"
                  font-weight: 700
              - type: state-label
                entity: sensor.solis_s5_eh1p_today_energy_consumption
                style:
                  left: 81%
                  top: 39%
                  width: 17%
                  transform: translate(0, -50%)
                  text-align: left
                  color: "#111827"
                  font-size: "clamp(10px, 0.95vw, 14px)"
                  font-weight: 600

              # Wechselrichter
              - type: state-label
                entity: sensor.solis_s5_eh1p_status_string
                style:
                  left: 50%
                  top: 59%
                  color: "#20ae55"
                  font-size: "clamp(10px, 0.85vw, 12px)"
                  font-weight: 600

              # Batterie
              - type: state-label
                entity: sensor.jk_bms_total_jk_bms_total_power
                style:
                  left: 11%
                  top: 72%
                  width: 18%
                  transform: translate(0, -50%)
                  text-align: left
                  color: "#111827"
                  font-size: "clamp(22px, 2.4vw, 36px)"
                  font-weight: 700
              - type: state-label
                entity: sensor.jk_bms_total_jk_bms_total_soc
                style:
                  left: 11%
                  top: 89%
                  width: 18%
                  transform: translate(0, -50%)
                  text-align: left
                  color: "#111827"
                  font-size: "clamp(10px, 0.95vw, 14px)"
                  font-weight: 600

              # Netz
              - type: state-label
                entity: sensor.solis_s5_eh1p_ac_grid_port_power
                style:
                  left: 81%
                  top: 72%
                  width: 16%
                  transform: translate(0, -50%)
                  text-align: left
                  color: "#111827"
                  font-size: "clamp(22px, 2.4vw, 36px)"
                  font-weight: 700
              - type: state-label
                entity: sensor.solis_s5_eh1p_today_energy_fed_into_grid
                style:
                  left: 81%
                  top: 89%
                  width: 17%
                  transform: translate(0, -50%)
                  text-align: left
                  color: "#111827"
                  font-size: "clamp(10px, 0.95vw, 14px)"
                  font-weight: 600

          - &current_metrics
            type: grid
            columns: 5
            square: false
            visibility:
              - condition: screen
                media_query: "(min-width: 700px)"
            cards:
              - type: custom:mushroom-entity-card
                entity: sensor.solis_s5_eh1p_pv_voltage_1
                name: PV1 Spannung
                icon: mdi:solar-panel-large
                icon_color: amber
              - type: custom:mushroom-entity-card
                entity: sensor.solis_s5_eh1p_pv_voltage_2
                name: PV2 Spannung
                icon: mdi:solar-panel-large
                icon_color: amber
              - type: custom:mushroom-entity-card
                entity: sensor.batteriespannung_1_dezimal
                name: Batterie
                icon: mdi:battery
                icon_color: green
              - type: custom:mushroom-entity-card
                entity: sensor.jk_bms_total_jk_bms_total_current
                name: Batteriestrom
                icon: mdi:current-dc
                icon_color: green
              - type: custom:mushroom-entity-card
                entity: sensor.jk_bms_pack_00_temperature_01
                name: BMS Temperatur
                icon: mdi:thermometer
                icon_color: orange

          - <<: *current_metrics
            columns: 2
            visibility:
              - condition: screen
                media_query: "(max-width: 699px)"

          - type: custom:apexcharts-card
            header:
              show: true
              title: Leistungsverlauf – letzte 24 Stunden
              show_states: false
            graph_span: 24h
            apex_config:
              chart:
                height: 340
                toolbar:
                  show: true
              legend:
                show: true
                position: bottom
              stroke:
                width: 2
              grid:
                borderColor: "#dce5ea"
              yaxis:
                labels:
                  formatter: |
                    EVAL:function(value) { return value.toFixed(1) + " kW"; }
            series:
              - entity: sensor.solis_s5_eh1p_total_pv_power
                name: PV
                color: "#ffb000"
                type: line
                unit: kW
                transform: "return x / 1000;"
                group_by:
                  func: avg
                  duration: 5min
              - entity: sensor.solis_s5_eh1p_household_load_power
                name: Verbrauch
                color: "#2196f3"
                type: line
                unit: kW
                transform: "return x / 1000;"
                group_by:
                  func: avg
                  duration: 5min
              - entity: sensor.jk_bms_total_jk_bms_total_power
                name: Batterie
                color: "#20ae55"
                type: line
                unit: kW
                group_by:
                  func: avg
                  duration: 5min
              - entity: sensor.solis_s5_eh1p_ac_grid_port_power
                name: Netz
                color: "#ef5545"
                type: line
                unit: kW
                transform: "return x / 1000;"
                group_by:
                  func: avg
                  duration: 5min

  - title: Historische Werte
    path: historische-werte
    icon: mdi:chart-line
    type: panel
    cards:
      - type: vertical-stack
        cards:
          - type: custom:mushroom-title-card
            title: 2. Historische Werte
            subtitle: 24 Stunden · Leistung · Batterie · PV-Eingänge

          - type: custom:mushroom-chips-card
            alignment: start
            chips:
              - type: template
                icon: mdi:clock-outline
                content: 24 Stunden
                icon_color: blue
                tap_action:
                  action: navigate
                  navigation_path: /pv-battery-dashboard/historische-werte
              - type: template
                icon: mdi:calendar-week
                content: 7 Tage
                tap_action:
                  action: navigate
                  navigation_path: /pv-battery-dashboard/historische-werte-7-tage
              - type: template
                icon: mdi:calendar-month
                content: 30 Tage
                tap_action:
                  action: navigate
                  navigation_path: /pv-battery-dashboard/historische-werte-30-tage
              - type: template
                icon: mdi:calendar-range
                content: 12 Monate
                tap_action:
                  action: navigate
                  navigation_path: /pv-battery-dashboard/historische-werte-12-monate

          - type: custom:apexcharts-card
            header:
              show: true
              title: Leistung
            graph_span: 24h
            apex_config:
              chart:
                height: 330
              stroke:
                width: 2
              legend:
                position: bottom
              grid:
                borderColor: "#dce5ea"
            series:
              - entity: sensor.solis_s5_eh1p_total_pv_power
                name: PV
                color: "#ffb000"
                type: area
                transform: "return x / 1000;"
                unit: kW
                group_by: {func: avg, duration: 5min}
              - entity: sensor.solis_s5_eh1p_household_load_power
                name: Verbrauch
                color: "#168cf0"
                type: line
                transform: "return x / 1000;"
                unit: kW
                group_by: {func: avg, duration: 5min}
              - entity: sensor.jk_bms_total_jk_bms_total_power
                name: Batterie
                color: "#20ae55"
                type: area
                unit: kW
                group_by: {func: avg, duration: 5min}
              - entity: sensor.solis_s5_eh1p_ac_grid_port_power
                name: Netz
                color: "#ef5545"
                type: line
                transform: "return x / 1000;"
                unit: kW
                group_by: {func: avg, duration: 5min}

          - type: custom:apexcharts-card
            header:
              show: true
              title: Batterie SOC
            graph_span: 24h
            apex_config:
              chart: {height: 250}
              yaxis: {min: 0, max: 100}
              fill:
                type: gradient
              legend:
                position: bottom
            series:
              - entity: sensor.jk_bms_total_jk_bms_total_soc
                name: Gesamt
                color: "#20ae55"
                type: area
                group_by: {func: avg, duration: 5min}

          - &history_detail_grid
            type: grid
            columns: 2
            square: false
            visibility:
              - condition: screen
                media_query: "(min-width: 700px)"
            cards:
              - type: custom:apexcharts-card
                header: {show: true, title: Batteriespannung & Strom}
                graph_span: 24h
                yaxis:
                  - id: voltage
                  - id: current
                    opposite: true
                apex_config:
                  chart: {height: 270}
                  legend: {position: bottom}
                series:
                  - entity: sensor.jk_bms_total_jk_bms_total_voltage
                    name: Spannung
                    color: "#168cf0"
                    yaxis_id: voltage
                    type: line
                  - entity: sensor.jk_bms_total_jk_bms_total_current
                    name: Strom
                    color: "#ef5545"
                    yaxis_id: current
                    type: line
              - type: custom:apexcharts-card
                header: {show: true, title: PV Eingänge (MPPT)}
                graph_span: 24h
                apex_config:
                  chart: {height: 270}
                  legend: {position: bottom}
                series:
                  - entity: sensor.solis_s5_eh1p_pv_voltage_1
                    name: MPPT 1
                    color: "#ffb000"
                    type: line
                  - entity: sensor.solis_s5_eh1p_pv_voltage_2
                    name: MPPT 2
                    color: "#20ae55"
                    type: line

          - <<: *history_detail_grid
            columns: 1
            visibility:
              - condition: screen
                media_query: "(max-width: 699px)"

  - title: Historische Werte · 7 Tage
    path: historische-werte-7-tage
    subview: true
    type: panel
    cards:
      - type: vertical-stack
        cards:
          - type: custom:mushroom-title-card
            title: 2. Historische Werte
            subtitle: 7 Tage · Leistung und Batterie-SOC
          - type: custom:mushroom-chips-card
            alignment: start
            chips:
              - {type: template, icon: mdi:clock-outline, content: 24 Stunden, tap_action: {action: navigate, navigation_path: /pv-battery-dashboard/historische-werte}}
              - {type: template, icon: mdi:calendar-week, content: 7 Tage, icon_color: blue, tap_action: {action: navigate, navigation_path: /pv-battery-dashboard/historische-werte-7-tage}}
              - {type: template, icon: mdi:calendar-month, content: 30 Tage, tap_action: {action: navigate, navigation_path: /pv-battery-dashboard/historische-werte-30-tage}}
              - {type: template, icon: mdi:calendar-range, content: 12 Monate, tap_action: {action: navigate, navigation_path: /pv-battery-dashboard/historische-werte-12-monate}}
          - type: custom:apexcharts-card
            header: {show: true, title: Leistung · 7 Tage}
            graph_span: 7d
            apex_config:
              chart: {height: 360}
              stroke: {width: 2}
              legend: {position: bottom}
              grid: {borderColor: "#dce5ea"}
            series:
              - {entity: sensor.solis_s5_eh1p_total_pv_power, name: PV, color: "#ffb000", type: area, unit: kW, transform: "return x / 1000;", group_by: {func: avg, duration: 30min}}
              - {entity: sensor.solis_s5_eh1p_household_load_power, name: Verbrauch, color: "#168cf0", type: line, unit: kW, transform: "return x / 1000;", group_by: {func: avg, duration: 30min}}
              - {entity: sensor.jk_bms_total_jk_bms_total_power, name: Batterie, color: "#20ae55", type: area, unit: kW, group_by: {func: avg, duration: 30min}}
              - {entity: sensor.solis_s5_eh1p_ac_grid_port_power, name: Netz, color: "#ef5545", type: line, unit: kW, transform: "return x / 1000;", group_by: {func: avg, duration: 30min}}
          - type: custom:apexcharts-card
            header: {show: true, title: Batterie SOC · 7 Tage}
            graph_span: 7d
            apex_config:
              chart: {height: 270}
              yaxis: {min: 0, max: 100}
            series:
              - {entity: sensor.jk_bms_total_jk_bms_total_soc, name: Gesamt, color: "#20ae55", type: area, group_by: {func: avg, duration: 30min}}

  - title: Historische Werte · 30 Tage
    path: historische-werte-30-tage
    subview: true
    type: panel
    cards:
      - type: vertical-stack
        cards:
          - type: custom:mushroom-title-card
            title: 2. Historische Werte
            subtitle: 30 Tage · Leistung und Batterie-SOC
          - type: custom:mushroom-chips-card
            alignment: start
            chips:
              - {type: template, icon: mdi:clock-outline, content: 24 Stunden, tap_action: {action: navigate, navigation_path: /pv-battery-dashboard/historische-werte}}
              - {type: template, icon: mdi:calendar-week, content: 7 Tage, tap_action: {action: navigate, navigation_path: /pv-battery-dashboard/historische-werte-7-tage}}
              - {type: template, icon: mdi:calendar-month, content: 30 Tage, icon_color: blue, tap_action: {action: navigate, navigation_path: /pv-battery-dashboard/historische-werte-30-tage}}
              - {type: template, icon: mdi:calendar-range, content: 12 Monate, tap_action: {action: navigate, navigation_path: /pv-battery-dashboard/historische-werte-12-monate}}
          - type: custom:apexcharts-card
            header: {show: true, title: Leistung · 30 Tage}
            graph_span: 30d
            apex_config:
              chart: {height: 360}
              stroke: {width: 2}
              legend: {position: bottom}
              grid: {borderColor: "#dce5ea"}
            series:
              - {entity: sensor.solis_s5_eh1p_total_pv_power, name: PV, color: "#ffb000", type: area, unit: kW, transform: "return x / 1000;", group_by: {func: avg, duration: 2h}}
              - {entity: sensor.solis_s5_eh1p_household_load_power, name: Verbrauch, color: "#168cf0", type: line, unit: kW, transform: "return x / 1000;", group_by: {func: avg, duration: 2h}}
              - {entity: sensor.jk_bms_total_jk_bms_total_power, name: Batterie, color: "#20ae55", type: area, unit: kW, group_by: {func: avg, duration: 2h}}
              - {entity: sensor.solis_s5_eh1p_ac_grid_port_power, name: Netz, color: "#ef5545", type: line, unit: kW, transform: "return x / 1000;", group_by: {func: avg, duration: 2h}}
          - type: custom:apexcharts-card
            header: {show: true, title: Batterie SOC · 30 Tage}
            graph_span: 30d
            apex_config:
              chart: {height: 270}
              yaxis: {min: 0, max: 100}
            series:
              - {entity: sensor.jk_bms_total_jk_bms_total_soc, name: Gesamt, color: "#20ae55", type: area, group_by: {func: avg, duration: 2h}}

  - title: Historische Werte · 12 Monate
    path: historische-werte-12-monate
    subview: true
    type: panel
    cards:
      - type: vertical-stack
        cards:
          - type: custom:mushroom-title-card
            title: 2. Historische Werte
            subtitle: 12 Monate · Leistung und Batterie-SOC
          - type: custom:mushroom-chips-card
            alignment: start
            chips:
              - {type: template, icon: mdi:clock-outline, content: 24 Stunden, tap_action: {action: navigate, navigation_path: /pv-battery-dashboard/historische-werte}}
              - {type: template, icon: mdi:calendar-week, content: 7 Tage, tap_action: {action: navigate, navigation_path: /pv-battery-dashboard/historische-werte-7-tage}}
              - {type: template, icon: mdi:calendar-month, content: 30 Tage, tap_action: {action: navigate, navigation_path: /pv-battery-dashboard/historische-werte-30-tage}}
              - {type: template, icon: mdi:calendar-range, content: 12 Monate, icon_color: blue, tap_action: {action: navigate, navigation_path: /pv-battery-dashboard/historische-werte-12-monate}}
          - type: custom:apexcharts-card
            header: {show: true, title: Leistung · 12 Monate}
            graph_span: 365d
            apex_config:
              chart: {height: 360}
              stroke: {width: 2}
              legend: {position: bottom}
              grid: {borderColor: "#dce5ea"}
            series:
              - {entity: sensor.solis_s5_eh1p_total_pv_power, name: PV, color: "#ffb000", type: area, unit: kW, transform: "return x / 1000;", group_by: {func: avg, duration: 1d}}
              - {entity: sensor.solis_s5_eh1p_household_load_power, name: Verbrauch, color: "#168cf0", type: line, unit: kW, transform: "return x / 1000;", group_by: {func: avg, duration: 1d}}
              - {entity: sensor.jk_bms_total_jk_bms_total_power, name: Batterie, color: "#20ae55", type: area, unit: kW, group_by: {func: avg, duration: 1d}}
              - {entity: sensor.solis_s5_eh1p_ac_grid_port_power, name: Netz, color: "#ef5545", type: line, unit: kW, transform: "return x / 1000;", group_by: {func: avg, duration: 1d}}
          - type: custom:apexcharts-card
            header: {show: true, title: Batterie SOC · 12 Monate}
            graph_span: 365d
            apex_config:
              chart: {height: 270}
              yaxis: {min: 0, max: 100}
            series:
              - {entity: sensor.jk_bms_total_jk_bms_total_soc, name: Gesamt, color: "#20ae55", type: area, group_by: {func: avg, duration: 1d}}

  - title: Summierte Werte
    path: summierte-werte
    icon: mdi:sigma
    type: panel
    cards:
      - type: vertical-stack
        cards:
          - type: custom:mushroom-title-card
            title: 3. Summierte Werte
            subtitle: Tages-, Monats- und Jahresenergie

          - &summary_totals_grid
            type: grid
            columns: 2
            square: false
            visibility:
              - condition: screen
                media_query: "(min-width: 700px)"
            cards:
              - type: custom:mushroom-entity-card
                entity: sensor.solis_s5_eh1p_pv_today_energy_generation
                name: PV Ertrag
                icon: mdi:white-balance-sunny
                icon_color: amber
                layout: horizontal
              - type: custom:mushroom-entity-card
                entity: sensor.solis_s5_eh1p_today_energy_consumption
                name: Verbrauch
                icon: mdi:home
                icon_color: deep-orange
                layout: horizontal
              - type: custom:mushroom-entity-card
                entity: sensor.solis_s5_eh1p_today_energy_imported_from_grid
                name: Netzbezug
                icon: mdi:transmission-tower-import
                icon_color: blue-grey
                layout: horizontal
              - type: custom:mushroom-entity-card
                entity: sensor.solis_s5_eh1p_today_energy_fed_into_grid
                name: Einspeisung
                icon: mdi:swap-horizontal-bold
                icon_color: green
                layout: horizontal

          - <<: *summary_totals_grid
            columns: 1
            visibility:
              - condition: screen
                media_query: "(max-width: 699px)"

          - type: custom:apexcharts-card
            header: {show: true, title: Tageswerte · 14 Tage}
            graph_span: 14d
            span: {end: day}
            apex_config:
              chart: {height: 330}
              legend: {position: bottom}
              plotOptions:
                bar: {columnWidth: 56%}
            series:
              - entity: sensor.solis_s5_eh1p_pv_total_energy_generation
                name: PV
                color: "#ffb000"
                type: column
                statistics: {type: change, period: day}
              - entity: sensor.solis_s5_eh1p_total_energy_consumption
                name: Verbrauch
                color: "#ff6d2d"
                type: column
                statistics: {type: change, period: day}
              - entity: sensor.solis_s5_eh1p_total_energy_imported_from_grid
                name: Netzbezug
                color: "#607d8b"
                type: column
                statistics: {type: change, period: day}
              - entity: sensor.solis_s5_eh1p_total_energy_fed_into_grid
                name: Einspeisung
                color: "#20ae55"
                type: column
                statistics: {type: change, period: day}

          - &summary_month_grid
            type: grid
            columns: 2
            square: false
            visibility:
              - condition: screen
                media_query: "(min-width: 700px)"
            cards:
              - type: custom:apexcharts-card
                header: {show: true, title: Monatsübersicht · 12 Monate}
                graph_span: 365d
                apex_config:
                  chart: {height: 290}
                  legend: {position: bottom}
                series:
                  - entity: sensor.solis_s5_eh1p_pv_total_energy_generation
                    name: PV
                    color: "#ffb000"
                    type: column
                    statistics: {type: change, period: month}
                  - entity: sensor.solis_s5_eh1p_total_energy_consumption
                    name: Verbrauch
                    color: "#168cf0"
                    type: column
                    statistics: {type: change, period: month}
              - type: vertical-stack
                cards:
                  - type: custom:mushroom-title-card
                    title: Batterie & Langzeitwerte
                  - type: grid
                    columns: 2
                    square: false
                    cards:
                      - type: custom:mushroom-entity-card
                        entity: sensor.solis_s5_eh1p_today_battery_charge_energy
                        name: Heute geladen
                        icon: mdi:battery-plus
                        icon_color: green
                      - type: custom:mushroom-entity-card
                        entity: sensor.solis_s5_eh1p_today_battery_discharge_energy
                        name: Heute entladen
                        icon: mdi:battery-minus
                        icon_color: orange
                      - type: custom:mushroom-entity-card
                        entity: sensor.solis_s5_eh1p_pv_current_month_energy_generation
                        name: PV Monat
                        icon: mdi:calendar-month
                      - type: custom:mushroom-entity-card
                        entity: sensor.solis_s5_eh1p_pv_this_year_energy_generation
                        name: PV Jahr
                        icon: mdi:calendar

          - <<: *summary_month_grid
            columns: 1
            visibility:
              - condition: screen
                media_query: "(max-width: 699px)"

  - title: Einstellungen Wechselrichter
    path: einstellungen-wechselrichter
    icon: mdi:tune-variant
    type: panel
    cards:
      - type: vertical-stack
        cards:
          - type: custom:mushroom-title-card
            title: 4. Einstellungen Wechselrichter
            subtitle: Solis S5-EH1P · nur verifizierte Funktionen

          - &inverter_status_grid
            type: grid
            columns: 3
            square: false
            visibility:
              - condition: screen
                media_query: "(min-width: 700px)"
            cards:
              - type: custom:mushroom-entity-card
                entity: sensor.solis_s5_eh1p_status_string
                name: Betriebsstatus
                icon: mdi:check-circle
                icon_color: green
              - type: custom:mushroom-entity-card
                entity: sensor.solis_s5_eh1p_temperature
                name: Wechselrichtertemperatur
                icon: mdi:thermometer
                icon_color: orange
              - type: custom:mushroom-entity-card
                entity: switch.solis_s5_eh1p_solis_modbus_enabled
                name: Solis Modbus
                icon: mdi:connection
                icon_color: blue

          - <<: *inverter_status_grid
