title: PV & Batteries

views:
  - title: Aktuelle Werte
    path: aktuelle-werte
    icon: mdi:solar-power
    type: panel
    cards:
      - type: vertical-stack
        cards:
          - type: custom:mushroom-title-card
            title: Energiefluss (aktuell)

          - type: picture-elements
            image: /pv-battery-dashboard-static/energy_flow_bg_v0112.svg
            elements:
              # PV
              - type: state-label
                entity: sensor.solis_s5_eh1p_total_pv_power
                style:
                  left: 11%
                  top: 29%
                  width: 18%
                  transform: translate(0, -50%)
                  text-align: left
                  color: "#111827"
                  font-size: "clamp(22px, 2.4vw, 36px)"
                  font-weight: 700
              - type: state-label
                entity: sensor.solis_s5_eh1p_pv_today_energy_generation
                prefix: "Tagesertrag  "
                style:
                  left: 11%
                  top: 40.5%
                  width: 20%
                  transform: translate(0, -50%)
                  text-align: left
                  color: "#111827"
                  font-size: "clamp(10px, 0.95vw, 14px)"
                  font-weight: 600

              # Verbrauch
              - type: state-label
                entity: sensor.solis_s5_eh1p_household_load_power
                style:
                  left: 81%
                  top: 29%
                  width: 16%
                  transform: translate(0, -50%)
                  text-align: left
                  color: "#111827"
                  font-size: "clamp(22px, 2.4vw, 36px)"
                  font-weight: 700
              - type: state-label
                entity: sensor.solis_s5_eh1p_today_energy_consumption
                prefix: "Tagesverbrauch  "
                style:
                  left: 81%
                  top: 40.5%
                  width: 17%
                  transform: translate(0, -50%)
                  text-align: left
                  color: "#111827"
                  font-size: "clamp(10px, 0.95vw, 14px)"
                  font-weight: 600

              # Wechselrichter
              - type: state-label
                entity: sensor.solis_s5_eh1p_status_string
                style:
                  left: 50%
                  top: 59%
                  color: "#20ae55"
                  font-size: "clamp(10px, 0.85vw, 12px)"
                  font-weight: 600

              # Batterie
              - type: state-label
                entity: sensor.jk_bms_total_jk_bms_total_power
                style:
                  left: 11%
                  top: 77%
                  width: 18%
                  transform: translate(0, -50%)
                  text-align: left
                  color: "#111827"
                  font-size: "clamp(22px, 2.4vw, 36px)"
                  font-weight: 700
              - type: state-label
                entity: sensor.jk_bms_total_jk_bms_total_soc
                prefix: "SOC  "
                style:
                  left: 11%
                  top: 88%
                  width: 18%
                  transform: translate(0, -50%)
                  text-align: left
                  color: "#111827"
                  font-size: "clamp(10px, 0.95vw, 14px)"
                  font-weight: 600

              # Netz
              - type: state-label
                entity: sensor.solis_s5_eh1p_ac_grid_port_power
                style:
                  left: 81%
                  top: 77%
                  width: 16%
                  transform: translate(0, -50%)
                  text-align: left
                  color: "#111827"
                  font-size: "clamp(22px, 2.4vw, 36px)"
                  font-weight: 700
              - type: state-label
                entity: sensor.solis_s5_eh1p_today_energy_fed_into_grid
                prefix: "Einspeisung heute  "
                style:
                  left: 81%
                  top: 88%
                  width: 17%
                  transform: translate(0, -50%)
                  text-align: left
                  color: "#111827"
                  font-size: "clamp(10px, 0.95vw, 14px)"
                  font-weight: 600

          - type: picture-elements
            image: /pv-battery-dashboard-static/metric_strip_v0112.svg
            elements:
              - type: state-label
                entity: sensor.solis_s5_eh1p_pv_voltage_1
                style:
                  left: 2.8%
                  top: 68%
                  width: 15%
                  transform: translate(0, -50%)
                  text-align: left
                  color: "#111827"
                  font-size: "clamp(14px, 1.55vw, 23px)"
                  font-weight: 700
              - type: state-label
                entity: sensor.solis_s5_eh1p_pv_voltage_2
                style:
                  left: 22.8%
                  top: 68%
                  width: 15%
                  transform: translate(0, -50%)
                  text-align: left
                  color: "#111827"
                  font-size: "clamp(14px, 1.55vw, 23px)"
                  font-weight: 700
              - type: state-label
                entity: sensor.pv_battery_batteriespannung_1_dezimal
                style:
                  left: 42.8%
                  top: 68%
                  width: 15%
                  transform: translate(0, -50%)
                  text-align: left
                  color: "#111827"
                  font-size: "clamp(14px, 1.55vw, 23px)"
                  font-weight: 700
              - type: state-label
                entity: sensor.jk_bms_total_jk_bms_total_current
                style:
                  left: 62.8%
                  top: 68%
                  width: 15%
                  transform: translate(0, -50%)
                  text-align: left
                  color: "#111827"
                  font-size: "clamp(14px, 1.55vw, 23px)"
                  font-weight: 700
              - type: state-label
                entity: sensor.jk_bms_pack_00_temperature_01
                style:
                  left: 82.8%
                  top: 68%
                  width: 15%
                  transform: translate(0, -50%)
                  text-align: left
                  color: "#111827"
                  font-size: "clamp(14px, 1.55vw, 23px)"
                  font-weight: 700

          - type: custom:apexcharts-card
            header:
              show: true
              title: Leistungsverlauf – letzte 24 Stunden
              show_states: false
            graph_span: 24h
            apex_config:
              chart:
                height: 340
                toolbar:
                  show: true
              legend:
                show: true
                position: bottom
              stroke:
                width: 2
              grid:
                borderColor: "#dce5ea"
              yaxis:
                labels:
                  formatter: |
                    EVAL:function(value) { return value.toFixed(1) + " kW"; }
            series:
              - entity: sensor.solis_s5_eh1p_total_pv_power
                name: PV
                color: "#ffb000"
                type: line
                unit: kW
                transform: "return x / 1000;"
                group_by:
                  func: avg
                  duration: 5min
              - entity: sensor.solis_s5_eh1p_household_load_power
                name: Verbrauch
                color: "#2196f3"
                type: line
                unit: kW
                transform: "return x / 1000;"
                group_by:
                  func: avg
                  duration: 5min
              - entity: sensor.jk_bms_total_jk_bms_total_power
                name: Batterie
                color: "#20ae55"
                type: line
                unit: kW
                group_by:
                  func: avg
                  duration: 5min
              - entity: sensor.solis_s5_eh1p_ac_grid_port_power
                name: Netz
                color: "#ef5545"
                type: line
                unit: kW
                transform: "return x / 1000;"
                group_by:
                  func: avg
                  duration: 5min

  - title: Historische Werte
    path: historische-werte
    icon: mdi:chart-line
    type: masonry
    cards:
      - type: custom:mushroom-title-card
        title: Historische Werte
        subtitle: letzte 24 Stunden

      - type: grid
        columns: 2
        square: false
        cards:
          - type: custom:apexcharts-card
            header:
              show: true
              title: Leistung
            graph_span: 24h
            apex_config:
              chart:
                height: 280
              stroke:
                width: 2
            series:
              - entity: sensor.solis_s5_eh1p_total_pv_power
                name: PV
                type: area
                group_by:
                  func: avg
                  duration: 5min
              - entity: sensor.solis_s5_eh1p_household_load_power
                name: Verbrauch
                type: line
                group_by:
                  func: avg
                  duration: 5min
              - entity: sensor.jk_bms_total_jk_bms_total_power
                name: Batterie
                type: line
                group_by:
                  func: avg
                  duration: 5min
              - entity: sensor.solis_s5_eh1p_ac_grid_port_power
                name: Netz
                type: line
                group_by:
                  func: avg
                  duration: 5min

          - type: custom:apexcharts-card
            header:
              show: true
              title: Batterie SOC
            graph_span: 24h
            apex_config:
              chart:
                height: 280
              yaxis:
                min: 0
                max: 100
            series:
              - entity: sensor.jk_bms_total_jk_bms_total_soc
                name: Gesamt
                type: line
              - entity: sensor.jk_bms_pack_00_soc
                name: Pack 00
                type: line
              - entity: sensor.jk_bms_pack_01_soc
                name: Pack 01
                type: line
              - entity: sensor.jk_bms_pack_02_soc
                name: Pack 02
                type: line

          - type: custom:apexcharts-card
            header:
              show: true
              title: Batteriespannung & Strom
            graph_span: 24h
            yaxis:
              - id: voltage
                apex_config:
                  title:
                    text: V
              - id: current
                opposite: true
                apex_config:
                  title:
                    text: A
            apex_config:
              chart:
                height: 280
            series:
              - entity: sensor.jk_bms_total_jk_bms_total_voltage
                name: Spannung
                yaxis_id: voltage
                type: line
              - entity: sensor.jk_bms_total_jk_bms_total_current
                name: Strom
                yaxis_id: current
                type: line

          - type: custom:apexcharts-card
            header:
              show: true
              title: PV Eingänge (MPPT)
            graph_span: 24h
            yaxis:
              - id: power
                apex_config:
                  title:
                    text: W
              - id: voltage
                opposite: true
                apex_config:
                  title:
                    text: V
            apex_config:
              chart:
                height: 280
            series:
              - entity: sensor.solis_s5_eh1p_pv_power_1
                name: PV1 Leistung
                yaxis_id: power
                type: area
              - entity: sensor.solis_s5_eh1p_pv_power_2
                name: PV2 Leistung
                yaxis_id: power
                type: area
              - entity: sensor.solis_s5_eh1p_pv_voltage_1
                name: PV1 Spannung
                yaxis_id: voltage
                type: line
              - entity: sensor.solis_s5_eh1p_pv_voltage_2
                name: PV2 Spannung
                yaxis_id: voltage
                type: line

  - title: Summierte Werte
    path: summierte-werte
    icon: mdi:sigma
    type: masonry
    cards:
      - type: custom:mushroom-title-card
        title: Summierte Werte
        subtitle: Tag · 14 Tage · Monat · Jahr

      - type: grid
        columns: 3
        square: false
        cards:
          - type: custom:mushroom-entity-card
            entity: sensor.solis_s5_eh1p_pv_today_energy_generation
            name: PV heute
            icon: mdi:white-balance-sunny
          - type: custom:mushroom-entity-card
            entity: sensor.solis_s5_eh1p_today_energy_consumption
            name: Verbrauch heute
            icon: mdi:home-lightning-bolt
          - type: custom:mushroom-entity-card
            entity: sensor.solis_s5_eh1p_today_energy_imported_from_grid
            name: Netzbezug heute
            icon: mdi:transmission-tower-import
          - type: custom:mushroom-entity-card
            entity: sensor.solis_s5_eh1p_today_energy_fed_into_grid
            name: Einspeisung heute
            icon: mdi:transmission-tower-export
          - type: custom:mushroom-entity-card
            entity: sensor.solis_s5_eh1p_today_battery_charge_energy
            name: Batterie geladen
            icon: mdi:battery-plus
          - type: custom:mushroom-entity-card
            entity: sensor.solis_s5_eh1p_today_battery_discharge_energy
            name: Batterie entladen
            icon: mdi:battery-minus

      - type: custom:apexcharts-card
        header:
          show: true
          title: Tageswerte · 14 Tage
        graph_span: 14d
        span:
          end: day
        apex_config:
          chart:
            height: 320
          plotOptions:
            bar:
              columnWidth: 60%
        series:
          - entity: sensor.solis_s5_eh1p_pv_total_energy_generation
            name: PV
            type: column
            statistics:
              type: change
              period: day
          - entity: sensor.solis_s5_eh1p_total_energy_consumption
            name: Verbrauch
            type: column
            statistics:
              type: change
              period: day
          - entity: sensor.solis_s5_eh1p_total_energy_imported_from_grid
            name: Netzbezug
            type: column
            statistics:
              type: change
              period: day
          - entity: sensor.solis_s5_eh1p_total_energy_fed_into_grid
            name: Einspeisung
            type: column
            statistics:
              type: change
              period: day

      - type: grid
        columns: 2
        square: false
        cards:
          - type: custom:mushroom-entity-card
            entity: sensor.solis_s5_eh1p_pv_current_month_energy_generation
            name: PV aktueller Monat
            icon: mdi:calendar-month
          - type: custom:mushroom-entity-card
            entity: sensor.solis_s5_eh1p_pv_this_year_energy_generation
            name: PV aktuelles Jahr
            icon: mdi:calendar

      - type: custom:apexcharts-card
        header:
          show: true
          title: Monatsübersicht · 12 Monate
        graph_span: 365d
        apex_config:
          chart:
            height: 320
        series:
          - entity: sensor.solis_s5_eh1p_pv_total_energy_generation
            name: PV
            type: column
            statistics:
              type: change
              period: month
          - entity: sensor.solis_s5_eh1p_total_energy_consumption
            name: Verbrauch
            type: column
            statistics:
              type: change
              period: month
          - entity: sensor.solis_s5_eh1p_total_energy_imported_from_grid
            name: Netzbezug
            type: column
            statistics:
              type: change
              period: month
          - entity: sensor.solis_s5_eh1p_total_energy_fed_into_grid
            name: Einspeisung
            type: column
            statistics:
              type: change
              period: month

  - title: Einstellungen Wechselrichter
    path: einstellungen-wechselrichter
    icon: mdi:tune-variant
    type: masonry
    cards:
      - type: custom:mushroom-title-card
        title: Einstellungen Wechselrichter
        subtitle: Solis S5-EH1P

      - type: grid
        columns: 3
        square: false
        cards:
          - type: custom:mushroom-entity-card
            entity: sensor.solis_s5_eh1p_status_string
            name: Status
            icon: mdi:check-circle-outline
          - type: custom:mushroom-entity-card
            entity: sensor.solis_s5_eh1p_temperature
            name: Temperatur
            icon: mdi:thermometer
          - type: custom:mushroom-entity-card
            entity: switch.solis_s5_eh1p_solis_modbus_enabled
            name: Solis Modbus
            icon: mdi:connection

      - type: entities
        title: Batterie / BMS
        entities:
          - entity: sensor.solis_s5_eh1p_battery_charge_current_limitation_bms
            name: Max. Ladestrom BMS
          - entity: sensor.solis_s5_eh1p_battery_discharge_current_limitation_bms
            name: Max. Entladestrom BMS
          - entity: sensor.solis_s5_eh1p_battery_voltage_bms
            name: Batteriespannung BMS
          - entity: sensor.solis_s5_eh1p_battery_current_bms
            name: Batteriestrom BMS
          - entity: sensor.solis_s5_eh1p_battery_soh
            name: Batterie SOH

      - type: entities
        title: Diagnose
        entities:
          - entity: sensor.solis_s5_eh1p_model_no
            name: Modell
          - entity: sensor.solis_s5_eh1p_serial_number
            name: Seriennummer
          - entity: sensor.solis_s5_eh1p_protocol_version
            name: Protokollversion
          - entity: sensor.solis_s5_eh1p_dsp_version
            name: DSP Version
          - entity: sensor.solis_s5_eh1p_hmi_version
            name: HMI Version
          - entity: sensor.solis_s5_eh1p_last_modbus_success
            name: Letzte Modbus-Antwort
          - entity: sensor.solis_s5_eh1p_alarm_code_data
            name: Alarmcode

  - title: Einstellungen JK BMS
    path: einstellungen-jk-bms
    icon: mdi:battery-cog
    type: masonry
    cards:
      - type: custom:mushroom-title-card
        title: JK BMS
        subtitle: Gesamtwerte und drei Batterie-Packs

      - type: grid
        columns: 4
        square: false
        cards:
          - type: custom:mushroom-entity-card
            entity: sensor.jk_bms_total_jk_bms_packs_count
            name: Packs
            icon: mdi:battery-multiple
          - type: custom:mushroom-entity-card
            entity: sensor.jk_bms_total_jk_bms_total_soc
            name: Gesamt SOC
            icon: mdi:battery-high
          - type: custom:mushroom-entity-card
            entity: sensor.jk_bms_total_jk_bms_total_voltage
            name: Spannung
            icon: mdi:flash
          - type: custom:mushroom-entity-card
            entity: sensor.jk_bms_total_jk_bms_total_current
            name: Strom
            icon: mdi:current-dc
          - type: custom:mushroom-entity-card
            entity: sensor.jk_bms_total_jk_bms_total_power
            name: Leistung
            icon: mdi:lightning-bolt
          - type: custom:mushroom-entity-card
            entity: sensor.jk_bms_total_jk_bms_max_cell_voltage
            name: Höchste Zelle
            icon: mdi:arrow-up-bold
          - type: custom:mushroom-entity-card
            entity: sensor.jk_bms_total_jk_bms_min_cell_voltage
            name: Niedrigste Zelle
            icon: mdi:arrow-down-bold
          - type: custom:mushroom-entity-card
            entity: sensor.jk_bms_total_jk_bms_cell_voltage_delta
            name: Zell-Delta
            icon: mdi:delta

      - type: grid
        columns: 3
        square: false
        cards:
          - type: entities
            title: Pack 00
            entities:
              - sensor.jk_bms_pack_00_soc
              - sensor.jk_bms_pack_00_soh
              - sensor.jk_bms_pack_00_voltage
              - sensor.jk_bms_pack_00_current
              - sensor.jk_bms_pack_00_power
              - sensor.jk_bms_pack_00_cycle_count
              - sensor.jk_bms_pack_00_temperature_01
              - sensor.jk_bms_pack_00_balance_current
              - binary_sensor.jk_bms_pack_00_charge_enabled_status
              - binary_sensor.jk_bms_pack_00_discharge_enabled_status
              - binary_sensor.jk_bms_pack_00_cell_over_voltage_protection
              - binary_sensor.jk_bms_pack_00_cell_under_voltage_protection
              - binary_sensor.jk_bms_pack_00_short_circuit_protection

          - type: entities
            title: Pack 01
            entities:
              - sensor.jk_bms_pack_01_soc
              - sensor.jk_bms_pack_01_soh
              - sensor.jk_bms_pack_01_voltage
              - sensor.jk_bms_pack_01_current
              - sensor.jk_bms_pack_01_power
              - sensor.jk_bms_pack_01_cycle_count
              - sensor.jk_bms_pack_01_temperature_01
              - sensor.jk_bms_pack_01_balance_current
              - binary_sensor.jk_bms_pack_01_charge_enabled_status
              - binary_sensor.jk_bms_pack_01_discharge_enabled_status
              - binary_sensor.jk_bms_pack_01_cell_over_voltage_protection
              - binary_sensor.jk_bms_pack_01_cell_under_voltage_protection
              - binary_sensor.jk_bms_pack_01_short_circuit_protection

          - type: entities
            title: Pack 02
            entities:
              - sensor.jk_bms_pack_02_soc
              - sensor.jk_bms_pack_02_soh
              - sensor.jk_bms_pack_02_voltage
              - sensor.jk_bms_pack_02_current
              - sensor.jk_bms_pack_02_power
              - sensor.jk_bms_pack_02_cycle_count
              - sensor.jk_bms_pack_02_temperature_01
              - sensor.jk_bms_pack_02_balance_current
              - binary_sensor.jk_bms_pack_02_charge_enabled_status
              - binary_sensor.jk_bms_pack_02_discharge_enabled_status
              - binary_sensor.jk_bms_pack_02_cell_over_voltage_protection
              - binary_sensor.jk_bms_pack_02_cell_under_voltage_protection
              - binary_sensor.jk_bms_pack_02_short_circuit_protection
