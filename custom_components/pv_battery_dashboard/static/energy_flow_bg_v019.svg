<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 360">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f8fbfd"/>
      <stop offset="1" stop-color="#eef5f8"/>
    </linearGradient>
    <linearGradient id="inv" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#eef2f4"/>
      <stop offset="1" stop-color="#cbd3d8"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#7b8790" flood-opacity=".16"/>
    </filter>
    <marker id="greenArrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#22b455"/>
    </marker>
    <marker id="orangeArrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#f3a400"/>
    </marker>
    <marker id="redArrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#ef5545"/>
    </marker>
  </defs>

  <rect width="1000" height="360" rx="14" fill="url(#bg)"/>

  <!-- Four outer cards -->
  <g fill="#fff" stroke="#d7e0e5" filter="url(#shadow)">
    <rect x="24" y="30" width="270" height="118" rx="10"/>
    <rect x="706" y="30" width="270" height="118" rx="10"/>
    <rect x="24" y="202" width="270" height="118" rx="10"/>
    <rect x="706" y="202" width="270" height="118" rx="10"/>
  </g>

  <!-- Flow arrows -->
  <path d="M294 91 H421" fill="none" stroke="#22b455" stroke-width="3" stroke-dasharray="8 7" marker-end="url(#greenArrow)"/>
  <path d="M579 91 H706" fill="none" stroke="#f3a400" stroke-width="3" stroke-dasharray="8 7" marker-end="url(#orangeArrow)"/>
  <path d="M465 238 V261 H294" fill="none" stroke="#22b455" stroke-width="3" stroke-dasharray="8 7" marker-end="url(#greenArrow)"/>
  <path d="M535 238 V261 H706" fill="none" stroke="#ef5545" stroke-width="3" stroke-dasharray="8 7" marker-end="url(#redArrow)"/>

  <!-- Inverter -->
  <rect x="421" y="38" width="158" height="200" rx="10" fill="url(#inv)" stroke="#7e8b93" stroke-width="2" filter="url(#shadow)"/>
  <rect x="460" y="78" width="80" height="53" rx="5" fill="#f7fafb" stroke="#98a3aa"/>
  <rect x="476" y="91" width="48" height="21" rx="2" fill="#5f6d75"/>
  <circle cx="500" cy="157" r="8" fill="#22b455"/>
  <path d="M449 52 H551" stroke="#fff" stroke-width="4" opacity=".45"/>
  <text x="500" y="190" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="600" fill="#1f2937">Wechselrichter</text>

  <!-- PV icon -->
  <g transform="translate(67 63)" stroke="#ffb300" stroke-width="4" fill="none" stroke-linecap="round">
    <circle cx="0" cy="0" r="13" fill="#ffb300" stroke="none"/>
    <path d="M0-27V-20 M0 20V27 M-27 0H-20 M20 0H27 M-19-19L-14-14 M14 14L19 19 M19-19L14-14 M-14 14L-19 19"/>
  </g>
  <text x="112" y="69" font-family="Arial, sans-serif" font-size="20" font-weight="600" fill="#1f2937">PV</text>

  <!-- Consumption icon -->
  <g transform="translate(742 45)" fill="#ff7a32">
    <path d="M0 20 L27 0 L54 20 V52 H34 V32 H20 V52 H0 Z"/>
  </g>
  <text x="812" y="69" font-family="Arial, sans-serif" font-size="20" font-weight="600" fill="#1f2937">Verbrauch</text>

  <!-- Battery icon -->
  <g transform="translate(52 217)" stroke="#20ae55" stroke-width="4" fill="none">
    <rect x="0" y="8" width="30" height="58" rx="4"/>
    <path d="M9 1 H21"/>
  </g>
  <text x="112" y="241" font-family="Arial, sans-serif" font-size="20" font-weight="600" fill="#1f2937">Batterie</text>

  <!-- Grid icon -->
  <g transform="translate(742 214)" stroke="#37475a" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M27 0 L8 64 M27 0 L46 64 M16 21 H38 M12 37 H42 M8 53 H46 M18 64 L27 38 L36 64"/>
  </g>
  <text x="812" y="241" font-family="Arial, sans-serif" font-size="20" font-weight="600" fill="#1f2937">Netz</text>
</svg>